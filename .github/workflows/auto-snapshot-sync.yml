name: Auto Snapshot Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: auto-snapshot-sync
  cancel-in-progress: true

jobs:
  sync-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate snapshot
        run: npm run snapshot:generate

      - name: Commit snapshot updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot-manifest.json snapshots snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
            echo "has_changes=false" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "chore(snapshot): auto sync $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
          echo "has_changes=true" >> "$GITHUB_ENV"

      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ "$has_changes" != "true" ]; then
            echo "No snapshot changes, skipping deploy hook"
            exit 0
          fi

          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Deploy hook secret is not set, skipping deploy hook"
            exit 0
          fi

          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"